# cargo-deny: supply chain and licence gate (madde 37).

[advisories]
yanked = "deny"
ignore = [
    # SQLite before 3.54 can return uninitialized page-cache memory when it opens a
    # database together with a crafted `-wal` file of another page size (local; the victim
    # must open the attacker's files). The fix is libsqlite3-sys 0.39 (rusqlite 0.41), but
    # Servo 0.8 pins rusqlite 0.38 and two SQLite builds cannot link into one program.
    # Reachability: EON Browser opens only its own profile.sqlite and Servo's own stores,
    # in its own data folder, files it wrote itself; anyone who can plant a `-wal` there can
    # already rewrite the profile directly. Remove when Servo moves to rusqlite >= 0.41.
    "RUSTSEC-2026-0459",
]

[licenses]
private = { ignore = true }
# GPL-3.0-or-later project: permissive inbound licences, plus one file-level copyleft.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "BSL-1.0",
    "Unlicense",
    "0BSD",
    # adblock (Brave's adblock-rust), the filter engine. MPL-2.0 is copyleft per file and
    # combines with GPL-3.0 as a Larger Work (MPL-2.0 §3.3) because no file of it is marked
    # "Incompatible With Secondary Licenses" (checked in 0.13.6, 26 Nov 2026). Changes to
    # adblock's own files would stay MPL-2.0; EON does not change them.
    "MPL-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# madde 50c: the core never touches the network. tests/invariants.rs checks the tree too.
deny = [
    { name = "reqwest" },
    { name = "hyper" },
    { name = "ureq" },
    { name = "curl" },
    { name = "isahc" },
    { name = "rustls" },
    { name = "native-tls" },
    { name = "openssl" },
    { name = "tokio" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
