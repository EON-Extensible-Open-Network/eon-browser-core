[package]
name = "eon-browser-core"
description = "The EON Browser core: blocking, link cleaning, HTTPS upgrade, address bar, site settings, history and bookmarks. No engine, no GUI, no network access of its own."
# Tag v0.0.0 -> 0.0.0-alpha.
version = "0.0.0-alpha"
edition = "2021"
rust-version = "1.98"
license = "GPL-3.0-or-later"
repository = "https://github.com/EON-Extensible-Open-Network/eon-browser-core"
publish = false

# Every dependency is a supply-chain commitment (madde 37); each says why it is here.
[dependencies]
# Brave's filter engine: Adblock Plus and uBlock Origin syntax, network and cosmetic
# rules, a compiled form that loads fast. MPL-2.0, no file marked "Incompatible With
# Secondary Licenses", so it combines with GPL-3.0 as a Larger Work (MPL-2.0 §3.3).
# `single-thread` is off so a compiled shield is `Send`: it can be built off the main thread.
adblock = { version = "0.13.6", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
# URLs as the WHATWG standard parses them -- the same parser Servo uses.
url = "2.5.9"
# The public suffix list, compiled in: "which site is this" (example.co.uk, not co.uk)
# decides per-site settings and what an address-bar entry is.
psl = "2.1.264"
# History, bookmarks, sessions, site settings: one file per profile, full-text search.
# The version Servo itself uses: two copies of SQLite cannot link into one program, and
# one copy keeps the browser smaller.
rusqlite = { version = "0.38", features = ["bundled"] }
# Verifying and recording what a fetched list was.
sha2 = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
